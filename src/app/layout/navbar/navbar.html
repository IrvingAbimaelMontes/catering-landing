<header class="nav">

        <div class="title">Catering Social</div>
        <div class="sub">Eventos • Bodas • Corporativo</div>
      </div>

      {{ open ? '✕' : '☰' }}

      <button class="link" (click)="goTo('servicios')">Servicios</button>

      <button class="link" (click)="goTo('galeria')">Galería</button>

</header>
